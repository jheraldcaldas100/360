# Configuración para la DEMOSTRACIÓN EN VIVO (tiempos cortos).
# Los valores de la hipótesis real están en config_real.yaml.

# Fuente de video:
#   0, 1, 2...  -> webcam de la laptop o cámara virtual del celular (DroidCam, Iriun, Continuity Camera)
#   "http://IP_DEL_CELULAR:8080/video" -> app IP Webcam (Android)
#   "videos/prueba.mp4" -> archivo de video
fuente: 0
nombre_camara: "Celular demo"

modelo: yolo11n.pt      # se descarga solo la primera vez (~6 MB)
confianza: 0.4          # confianza mínima de cada detección (0 a 1)
tamano_imagen: 640      # bajar a 480 o 320 si la laptop va lenta
mostrar_ventana: true

# Alertas al celular por Telegram (opcional). Mejor usar variables de entorno
# TELEGRAM_TOKEN y TELEGRAM_CHAT_ID para no subir el token al repositorio.
telegram:
  token: ""
  chat_id: ""

# Descripción de cada alerta con IA (opcional; ver ia.py). Requiere la variable
# OPENAI_API_KEY con saldo en platform.openai.com (ChatGPT Plus no incluye la API).
ia:
  activa: false
  modelo: ""        # un modelo con visión de https://platform.openai.com/docs/models

# Mapa del campus en el dashboard. Posición de cada cámara en proporciones del plano (x, y).
mapa:
  imagen: ""        # ruta a un plano o captura de Google Maps (png/jpg); vacío = plano de ejemplo
  camaras:
    "Celular demo": [0.40, 0.62]

reglas:
  aglomeracion:
    activa: true
    personas_min: 3       # "muchas personas" para la demo
    segundos: 5           # durante al menos este tiempo

  objeto_desatendido:
    activa: true
    clases: [backpack, handbag, suitcase]
    segundos: 20          # hipótesis real: 600 s (10 min) sin nadie en el lugar
    margen: 1.0           # "el lugar" = la caja del objeto agrandada 1 vez su tamaño a cada lado
    segundos_para_reiniciar: 3   # una persona debe quedarse 3 s junto al objeto para reiniciar el conteo

  persona_en_suelo:
    activa: true
    segundos: 5           # hipótesis real: 30 s en el suelo
    proporcion: 1.3       # la caja de la persona es 1.3 veces más ancha que alta = horizontal

  zona_restringida:       # opcional
    activa: false
    zona: [0.6, 0.0, 1.0, 1.0]   # rectángulo en proporciones del video: x1, y1, x2, y2
    segundos: 2
