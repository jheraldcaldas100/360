[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#1D4ED8"
backgroundColor = "#F4F6F9"
secondaryBackgroundColor = "#E9EDF3"
textColor = "#111827"
borderColor = "#DCE1E8"
baseRadius = "0.5rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
chartCategoricalColors = ["#1D4ED8"]

[theme.sidebar]
backgroundColor = "#0F1B2D"
secondaryBackgroundColor = "#1B2A40"
textColor = "#E5EAF1"
borderColor = "#2A3B54"
